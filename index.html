<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hiszpański Master 1.6</title>
  
  <!-- Meta tags -->
  <meta name="theme-color" content="#020617">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS (xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 9999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SPANISH_CHARS = ['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'];
    const DATABASE_URL = 'https://marcino86krk.github.io/baza_esp.ods';

    const INITIAL_WORDS = [
      { id: '1', es: 'ser', pl: 'być', isVerb: true, isManual: false },
      { id: '2', es: 'estar', pl: 'być / znajdować się', isVerb: true, isManual: false },
      { id: '3', es: 'hablar', pl: 'mówić', isVerb: true, isManual: false },
      { id: '4', es: 'comer', pl: 'jeść', isVerb: true, isManual: false },
      { id: '5', es: 'beber', pl: 'pić', isVerb: true, isManual: false },
      { id: '6', es: 'hola', pl: 'cześć', isVerb: false, isManual: false },
      { id: '7', es: 'gracias', pl: 'dziękuję', isVerb: false, isManual: false },
      { id: '8', es: 'agua', pl: 'woda', isVerb: false, isManual: false },
      { id: '9', es: 'amigo', pl: 'przyjaciel', isVerb: false, isManual: false },
      { id: '10', es: 'casa', pl: 'dom', isVerb: false, isManual: false }
    ];

    const IRREGULAR_VERBS = {
      'ser': {
        presente: { yo: 'soy', tu: 'eres', el: 'es', nosotros: 'somos', vosotros: 'sois', ellos: 'son' },
        pasado: { yo: 'fui', tu: 'fuiste', el: 'fue', nosotros: 'fuimos', vosotros: 'fuisteis', ellos: 'fueron' },
        futuro: { yo: 'seré', tu: 'serás', el: 'será', nosotros: 'seremos', vosotros: 'seréis', ellos: 'serán' }
      },
      'estar': {
        presente: { yo: 'estoy', tu: 'estás', el: 'está', nosotros: 'estamos', vosotros: 'estáis', ellos: 'están' },
        pasado: { yo: 'estuve', tu: 'estuviste', el: 'estuvo', nosotros: 'estuvimos', vosotros: 'estuvisteis', ellos: 'estuvieron' },
        futuro: { yo: 'estaré', tu: 'estarás', el: 'estará', nosotros: 'estaremos', vosotros: 'estaréis', ellos: 'estarán' }
      },
      'ir': {
        presente: { yo: 'voy', tu: 'vas', el: 'va', nosotros: 'vamos', vosotros: 'vais', ellos: 'van' },
        pasado: { yo: 'fui', tu: 'fuiste', el: 'fue', nosotros: 'fuimos', vosotros: 'fuisteis', ellos: 'fueron' },
        futuro: { yo: 'iré', tu: 'irás', el: 'irá', nosotros: 'iremos', vosotros: 'iréis', ellos: 'irán' }
      }
    };

    function SpanishCharBar({ onInsertChar, className = "" }) {
      return (
        <div className={`flex flex-wrap gap-1 items-center justify-center bg-slate-900 p-1.5 rounded-xl border border-slate-800 ${className}`}>
          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mr-1">Znaki ES:</span>
          {SPANISH_CHARS.map(char => (
            <button
              key={char}
              type="button"
              onMouseDown={(e) => {
                e.preventDefault();
                onInsertChar(char);
              }}
              className="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center bg-slate-800 hover:bg-red-600 hover:text-white text-slate-200 font-bold text-sm rounded-lg border border-slate-700 active:scale-95 transition"
            >
              {char}
            </button>
          ))}
        </div>
      );
    }

    function Logo() {
      return (
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-red-600 via-amber-500 to-yellow-400 p-0.5 shadow-lg flex items-center justify-center">
            <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
              <svg viewBox="0 0 100 100" className="w-8 h-8 sm:w-9 sm:h-9">
                <path d="M 20,65 Q 50,55 80,65 L 80,80 Q 50,70 20,80 Z" fill="#f59e0b" opacity="0.9"/>
                <path d="M 20,65 Q 50,55 50,85 Q 35,75 20,80 Z" fill="#d97706"/>
                <path d="M 80,65 Q 50,55 50,85 Q 65,75 80,80 Z" fill="#f59e0b"/>
                <path d="M 30,42 Q 22,20 38,28 Q 50,38 50,48 Q 50,38 62,28 Q 78,20 70,42 Q 62,55 50,58 Q 38,55 30,42 Z" fill="#dc2626"/>
                <circle cx="42" cy="38" r="2" fill="#fef08a"/>
                <circle cx="58" cy="38" r="2" fill="#fef08a"/>
              </svg>
            </div>
          </div>
          <div>
            <h1 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1">
              HISZPAŃSKI <span className="text-red-500">MASTER 1.6</span>
            </h1>
            <p className="text-[10px] sm:text-[11px] text-slate-400 font-medium">Seria: Językowy Master</p>
          </div>
        </div>
      );
    }

    function App() {
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem('hm_words');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) return parsed;
          } catch(e) {}
        }
        return INITIAL_WORDS;
      });

      const [loading, setLoading] = useState(false);
      const [loadMessage, setLoadMessage] = useState(null);
      const [activeTab, setActiveTab] = useState('flashcards');
      const [searchTerm, setSearchTerm] = useState('');
      const [direction, setDirection] = useState('random');

      // Formularz dodawania nowego słówka
      const [newEs, setNewEs] = useState('');
      const [newPl, setNewPl] = useState('');
      const [newIsVerb, setNewIsVerb] = useState(false);

      // Usunięcie bazy (hasło "erase")
      const [eraseModalOpen, setEraseModalOpen] = useState(false);
      const [erasePassword, setErasePassword] = useState('');
      const [eraseError, setEraseError] = useState(false);

      // Fiszki
      const [shuffledCards, setShuffledCards] = useState([]);
      const [fcIndex, setFcIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [fcIsEsToPl, setFcIsEsToPl] = useState(true);

      // Quiz
      const [shuffledQuiz, setShuffledQuiz] = useState([]);
      const [qIndex, setQIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [quizResult, setQuizResult] = useState(null);
      const [score, setScore] = useState(0);
      const [quizIsEsToPl, setQuizIsEsToPl] = useState(true);

      // Czasowniki
      const [verbIndex, setVerbIndex] = useState(0);
      const [selectedTense, setSelectedTense] = useState('presente');
      const [verbAnswers, setVerbAnswers] = useState({ yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' });
      const [verbSubmitted, setVerbSubmitted] = useState(false);

      const inputRefs = useRef({});
      const fileInputRef = useRef(null);
      const audioCtxRef = useRef(null);

      const playSound = (type) => {
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }

          const now = ctx.currentTime;

          if (type === 'correct') {
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();

            osc1.type = 'sine';
            osc2.type = 'triangle';

            osc1.frequency.setValueAtTime(523.25, now);
            osc1.frequency.setValueAtTime(659.25, now + 0.1);
            osc1.frequency.setValueAtTime(783.99, now + 0.2);

            osc2.frequency.setValueAtTime(261.63, now);
            osc2.frequency.setValueAtTime(329.63, now + 0.1);
            osc2.frequency.setValueAtTime(392.00, now + 0.2);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.5);
            osc2.stop(now + 0.5);
          } else if (type === 'incorrect') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
          }
        } catch (e) {}
      };

      const normalizeText = (text) => {
        return (text || '')
          .toLowerCase()
          .trim()
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "");
      };

      useEffect(() => {
        localStorage.setItem('hm_words', JSON.stringify(words));
      }, [words]);

      // Automatyczna aktualizacja bazy z serwera przy uruchomieniu aplikacji
      useEffect(() => {
        const autoUpdateDatabase = async () => {
          const urlsToTry = [
            DATABASE_URL,
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(DATABASE_URL)
          ];

          let blob = null;
          for (const url of urlsToTry) {
            try {
              const response = await fetch(url);
              if (!response.ok) continue;
              blob = await response.blob();
              break;
            } catch (e) {}
          }

          if (!blob) return;

          try {
            const arrayBuffer = await blob.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const wsname = workbook.SheetNames[0];
            const ws = workbook.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

            const wordMap = new Map();
            data.forEach(row => {
              if (row && row[0] && row[1]) {
                const es = String(row[0]).trim();
                const pl = String(row[1]).trim();
                const colC = row[2] ? String(row[2]).trim().toUpperCase() : '';
                const isVerbFromExcel = (colC === 'TAK' || colC === 'YES' || colC === 'TRUE' || colC === '1');
                const key = normalizeText(es);

                if (wordMap.has(key)) {
                  const item = wordMap.get(key);
                  const existingVars = item.pl.split(/[\/,;]/).map(v => normalizeText(v));
                  if (!existingVars.includes(normalizeText(pl))) {
                    item.pl = `${item.pl} / ${pl}`;
                  }
                  if (isVerbFromExcel) item.isVerb = true;
                } else {
                  wordMap.set(key, { es, pl, isVerb: isVerbFromExcel, isManual: false });
                }
              }
            });

            const newArr = [];
            let idCounter = Date.now();
            wordMap.forEach((val) => {
              newArr.push({ id: (idCounter++).toString(), es: val.es, pl: val.pl, isVerb: val.isVerb, isManual: false });
            });

            if (newArr.length > 0) {
              setWords(prev => {
                const existingManual = prev.filter(w => w.isManual);
                return [...existingManual, ...newArr];
              });
            }
          } catch (err) {}
        };

        autoUpdateDatabase();
      }, []);

      const handleDownloadAndSaveDatabase = async () => {
        setLoading(true);
        setLoadMessage("Pobieranie pliku bazy z serwera...");

        const urlsToTry = [
          DATABASE_URL,
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(DATABASE_URL)
        ];

        let blob = null;
        for (const url of urlsToTry) {
          try {
            const response = await fetch(url);
            if (!response.ok) continue;
            blob = await response.blob();
            break;
          } catch (e) {}
        }

        if (!blob) {
          setLoading(false);
          setLoadMessage("Nie udało się pobrać pliku z serwera.");
          setTimeout(() => setLoadMessage(null), 4000);
          return;
        }

        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'baza_esp.ods';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        try {
          const arrayBuffer = await blob.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const wsname = workbook.SheetNames[0];
          const ws = workbook.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

          const wordMap = new Map();
          data.forEach(row => {
            if (row && row[0] && row[1]) {
              const es = String(row[0]).trim();
              const pl = String(row[1]).trim();
              const colC = row[2] ? String(row[2]).trim().toUpperCase() : '';
              const isVerbFromExcel = (colC === 'TAK' || colC === 'YES' || colC === 'TRUE' || colC === '1');
              const key = normalizeText(es);

              if (wordMap.has(key)) {
                const item = wordMap.get(key);
                const existingVars = item.pl.split(/[\/,;]/).map(v => normalizeText(v));
                if (!existingVars.includes(normalizeText(pl))) {
                  item.pl = `${item.pl} / ${pl}`;
                }
                if (isVerbFromExcel) item.isVerb = true;
              } else {
                wordMap.set(key, { es, pl, isVerb: isVerbFromExcel, isManual: false });
              }
            }
          });

          const newArr = [];
          let idCounter = Date.now();
          wordMap.forEach((val) => {
            newArr.push({ id: (idCounter++).toString(), es: val.es, pl: val.pl, isVerb: val.isVerb, isManual: false });
          });

          if (newArr.length > 0) {
            const existingManual = words.filter(w => w.isManual);
            setWords([...existingManual, ...newArr]);
            setLoadMessage(`Sukces! Pobrano i zamontowano ${newArr.length} słówek.`);
          }
        } catch (err) {
          setLoadMessage("Pobrano plik, ale wystąpił błąd parsowania.");
        }

        setLoading(false);
        setTimeout(() => setLoadMessage(null), 4000);
      };

      const handleLoadLocalDatabase = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const wsname = workbook.SheetNames[0];
            const ws = workbook.Sheets[wsname];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

            const wordMap = new Map();
            rows.forEach(row => {
              if (row && row[0] && row[1]) {
                const es = String(row[0]).trim();
                const pl = String(row[1]).trim();
                const colC = row[2] ? String(row[2]).trim().toUpperCase() : '';
                const isVerbFromExcel = (colC === 'TAK' || colC === 'YES' || colC === 'TRUE' || colC === '1');
                const key = normalizeText(es);

                if (wordMap.has(key)) {
                  const item = wordMap.get(key);
                  const existingVars = item.pl.split(/[\/,;]/).map(v => normalizeText(v));
                  if (!existingVars.includes(normalizeText(pl))) {
                    item.pl = `${item.pl} / ${pl}`;
                  }
                  if (isVerbFromExcel) item.isVerb = true;
                } else {
                  wordMap.set(key, { es, pl, isVerb: isVerbFromExcel, isManual: false });
                }
              }
            });

            const newArr = [];
            let idCounter = Date.now();
            wordMap.forEach((val) => {
              newArr.push({ id: (idCounter++).toString(), es: val.es, pl: val.pl, isVerb: val.isVerb, isManual: false });
            });

            if (newArr.length > 0) {
              const existingManual = words.filter(w => w.isManual);
              setWords([...existingManual, ...newArr]);
              setLoadMessage(`Zamontowano pomyślnie ${newArr.length} słówek!`);
            } else {
              setLoadMessage("Plik nie zawiera poprawnych danych.");
            }
          } catch (err) {
            setLoadMessage("Błąd odczytu pliku.");
          }
          setTimeout(() => setLoadMessage(null), 4000);
        };
        reader.readAsArrayBuffer(file);
      };

      const handleSaveToDeviceDisk = () => {
        const sheetData = [
          ["Hiszpański", "Polski", "Czy czasownik (TAK/NIE)"],
          ...words.map(w => [w.es, w.pl, w.isVerb ? "TAK" : "NIE"])
        ];
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Baza słówek");
        XLSX.writeFile(wb, "baza_esp.ods");
      };

      const handleSaveManualWordsToDisk = () => {
        const manualWords = words.filter(w => w.isManual);
        if (manualWords.length === 0) {
          setLoadMessage("Brak ręcznie wpisanych słówek.");
          setTimeout(() => setLoadMessage(null), 4000);
          return;
        }

        const sheetData = [
          ["Hiszpański", "Polski", "Czy czasownik (TAK/NIE)"],
          ...manualWords.map(w => [w.es, w.pl, w.isVerb ? "TAK" : "NIE"])
        ];
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Wpisane słówka");
        XLSX.writeFile(wb, "wpisane.ods");

        setLoadMessage(`Pobrano plik z ${manualWords.length} słówkami.`);
        setTimeout(() => setLoadMessage(null), 4000);
      };

      const handleEraseDatabase = (e) => {
        e.preventDefault();
        if (erasePassword.trim().toLowerCase() === 'erase') {
          setWords([]);
          localStorage.removeItem('hm_words');
          setErasePassword('');
          setEraseError(false);
          setEraseModalOpen(false);
          setLoadMessage("Baza wyczyszczona.");
          setTimeout(() => setLoadMessage(null), 3000);
        } else {
          setEraseError(true);
        }
      };

      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newEs.trim() || !newPl.trim()) return;
        const newItem = {
          id: Date.now().toString(),
          es: newEs.trim(),
          pl: newPl.trim(),
          isVerb: newIsVerb,
          isManual: true
        };
        const updated = [newItem, ...words];
        setWords(updated);
        setNewEs('');
        setNewPl('');
        setNewIsVerb(false);

        setLoadMessage(`Dodano słówko: "${newItem.es}".`);
        setTimeout(() => setLoadMessage(null), 3000);
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      useEffect(() => {
        if (words.length > 0) {
          setShuffledCards(shuffleArray(words));
          setShuffledQuiz(shuffleArray(words));
        } else {
          setShuffledCards([]);
          setShuffledQuiz([]);
        }
      }, [words]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        if (direction === 'es-pl') setFcIsEsToPl(true);
        else if (direction === 'pl-es') setFcIsEsToPl(false);
        else setFcIsEsToPl(Math.random() < 0.5);
      }, [fcIndex, direction]);

      useEffect(() => {
        if (direction === 'es-pl') setQuizIsEsToPl(true);
        else if (direction === 'pl-es') setQuizIsEsToPl(false);
        else setQuizIsEsToPl(Math.random() < 0.5);
      }, [qIndex, direction]);

      const speakText = (text, lang = 'es-ES') => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        
        let processedText = text;
        if (lang === 'es-ES' && text) {
          const clean = text.trim();
          if (!clean.startsWith('¿') && !clean.startsWith('¡') && clean.length > 15 && clean.includes('?')) {
            processedText = '¿' + clean;
          }
        }

        const utterance = new SpeechSynthesisUtterance(processedText);
        utterance.lang = lang;
        
        if (lang === 'es-ES') {
          utterance.rate = 0.88;
          utterance.pitch = 1.0;
        } else {
          utterance.rate = 0.95;
          utterance.pitch = 1.0;
        }

        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
          const esVoice = voices.find(v => v.lang === 'es-ES' || v.lang === 'es_ES' || v.lang.startsWith('es'));
          if (esVoice) utterance.voice = esVoice;
        }

        window.speechSynthesis.speak(utterance);
      };

      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      }, []);

      const insertCharToRef = (refKey, char, setter, currentValue) => {
        const el = inputRefs.current[refKey];
        if (el && typeof el.selectionStart === 'number') {
          const start = el.selectionStart;
          const end = el.selectionEnd;
          const updated = currentValue.slice(0, start) + char + currentValue.slice(end);
          setter(updated);
          setTimeout(() => {
            el.focus();
            el.setSelectionRange(start + 1, start + 1);
          }, 0);
        } else {
          setter(currentValue + char);
        }
      };

      const generateConjugation = (verbStr, tense) => {
        if (!verbStr) return null;
        const v = normalizeText(verbStr);
        if (IRREGULAR_VERBS[v] && IRREGULAR_VERBS[v][tense]) {
          return IRREGULAR_VERBS[v][tense];
        }

        let stem = verbStr.slice(0, -2);
        let ending = verbStr.slice(-2).toLowerCase();

        if (ending === 'ar') {
          if (tense === 'presente') return { yo: stem + 'o', tu: stem + 'as', el: stem + 'a', nosotros: stem + 'amos', vosotros: stem + 'áis', ellos: stem + 'an' };
          if (tense === 'pasado') return { yo: stem + 'é', tu: stem + 'aste', el: stem + 'ó', nosotros: stem + 'amos', vosotros: stem + 'asteis', ellos: stem + 'aron' };
          if (tense === 'futuro') return { yo: verbStr + 'é', tu: verbStr + 'ás', el: verbStr + 'á', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'án' };
        } else if (ending === 'er' || ending === 'ir') {
          if (tense === 'presente') return { yo: stem + 'o', tu: stem + 'es', el: stem + 'e', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'en' };
          if (tense === 'pasado') return { yo: stem + 'í', tu: stem + 'iste', el: stem + 'ió', nosotros: stem + 'imos', vosotros: stem + 'isteis', ellos: stem + 'ieron' };
          if (tense === 'futuro') return { yo: verbStr + 'é', tu: verbStr + 'ás', el: verbStr + 'á', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'án' };
        }

        return { yo: stem + 'o', tu: stem + 'as', el: stem + 'a', nosotros: stem + 'amos', vosotros: stem + 'áis', ellos: stem + 'an' };
      };

                      type="text"
                      placeholder="Hiszpański (np. hola)"
                      value={newEs}
                      onChange={(e) => setNewEs(e.target.value)}
                      className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-red-500"
                    />
                    <input
                      type="text"
                      placeholder="Polski (np. cześć)"
                      value={newPl}
                      onChange={(e) => setNewPl(e.target.value)}
                      className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-red-500"
                    />
                    <div className="flex items-center justify-between pt-1">
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={newIsVerb}
                          onChange={(e) => setNewIsVerb(e.target.checked)}
                          className="rounded bg-slate-900 border-slate-700 text-red-600 focus:ring-red-500"
                        />
                        <span>Czasownik</span>
                      </label>
                      <button
                        type="submit"
                        className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg shadow transition"
                      >
                        Dodaj
                      </button>
                    </div>
                  </div>
                </form>

                <div className="bg-slate-950 p-3 rounded-xl border border-red-950/60 space-y-2 shrink-0">
                  <h3 className="text-xs font-bold text-red-400 flex items-center gap-1.5">
                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                    <span>Usuń bazę</span>
                  </h3>
                  <button
                    onClick={() => setEraseModalOpen(true)}
                    className="w-full py-2 bg-red-900 hover:bg-red-800 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition shadow"
                  >
                    <i data-lucide="alert-octagon" className="w-3.5 h-3.5"></i>
                    <span>Wyczyść bazę</span>
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
